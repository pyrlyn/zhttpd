# Benchmark configuration shared by nginx and zhttpd (rendered to bench/nginx.conf by
# bench/run.sh: /home/listepo.guest/zhttpd-perf-h3-large/candidate, 29880, 29443 are substituted). nginx is fully tuned;
# directives zhttpd does not implement are accepted with a warning (see zhttpd -t).
worker_processes 1;
worker_rlimit_nofile 65535;
error_log logs/error.log warn;
pid logs/bench.pid;

events {
    worker_connections 16384;
    use epoll;            # epoll on Linux: drop this line, both servers pick the best backend
    multi_accept on;
    accept_mutex off;
}

http {
    include /home/listepo.guest/zhttpd-perf-h3-large/candidate/tests/fixtures/nginx-default/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000000000;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    server {
        listen 29880 reuseport backlog=4096 default_server;
        listen 29443 ssl reuseport backlog=4096 default_server;
        http2 on;
        server_name localhost;

        ssl_certificate /home/listepo.guest/zhttpd-perf-h3-large/candidate/bench/certs/cert.pem;
        ssl_certificate_key /home/listepo.guest/zhttpd-perf-h3-large/candidate/bench/certs/key.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1h;
        ssl_session_tickets on;

        root /home/listepo.guest/zhttpd-perf-h3-large/candidate/bench/www;

        location / {
            try_files $uri =404;
        }

        # HttpArena "baseline": tiny dynamic plaintext answer
        location = /baseline11 {
            default_type text/plain;
            return 200 "3";
        }
    }
}
