worker_processes 1;
error_log /var/lib/zhttpd/logs/error.log info;
pid /var/lib/zhttpd/logs/zhttpd.pid;

events {
    worker_connections 1024;
}

http {
    default_type text/html;
    access_log /var/lib/zhttpd/logs/access.log;
    sendfile on;
    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/zhttpd;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
