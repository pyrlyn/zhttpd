[server]
compatibility = "litespeed"
config = "httpd_config.conf"

[acme]
domains = ["example.com", "*.example.com", "other.net"]
challenge = "dns-01"
dns_provider = "cloudflare"
email = "admin@example.com"
accept_terms = false
storage = ".acme-dns-litespeed"
directory = "https://acme-staging-v02.api.letsencrypt.org/directory"
