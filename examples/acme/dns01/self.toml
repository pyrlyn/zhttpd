[server]
compatibility = "self"

[http]
listen = "0.0.0.0:443"
root = "../site"
http2 = true

[acme]
domains = ["example.com", "*.example.com", "other.net"]
challenge = "dns-01"
dns_provider = "cloudflare"
email = "admin@example.com"
accept_terms = false
storage = ".acme-dns-self"
directory = "https://acme-staging-v02.api.letsencrypt.org/directory"
